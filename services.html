<body>

  <a class="brand" href="index.html" aria-label="RDweeb">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M4 12h16M12 3c3.5 3 3.5 15 0 18M12 3c-3.5 3-3.5 15 0 18"/></svg>

  <div class="menu" id="menu">
    <nav aria-label="Main" data-i18n-aria="nav.label">
      <a href="index.html" data-nav="home"><i>01</i><span data-i18n="nav.home">Home</span></a>
      <a href="portfolio.html" data-nav="portfolio"><i>02</i><span data-i18n="nav.portfolio">Portfolio</span></a>
      <a href="services.html" data-nav="services"><i>03</i><span data-i18n="nav.services">Services</span></a>
      <a href="contact.html" data-nav="contact"><i>04</i><span data-i18n="nav.contact">Contact</span></a>

      <button type="button" data-lang="de" lang="de">DE</button>
    </div>
  </div>
</header>
<main id="view" data-page="services" tabindex="-1">
<header class="page-head">
  <p class="chip" data-i18n="services.chip"></p>
  <h1 class="mega" data-i18n="nav.services" data-scramble></h1>
  <p class="lead" data-i18n="services.lead"></p>
</header>
<ul class="legend" aria-label="Status" data-i18n-aria="services.legend">
  <li><span class="status open" data-i18n="status.open"></span><span data-i18n="status.open.d"></span></li>
  <li><span class="status soon" data-i18n="status.soon"></span><span data-i18n="status.soon.d"></span></li>
  <li><span class="status closed" data-i18n="status.closed"></span><span data-i18n="status.closed.d"></span></li>
</ul>
<ul class="svc" id="svc"></ul>
<section class="block rv" id="how">
  <h2 class="h2"><span class="num">01</span><span data-i18n="how.h"></span></h2>
  <ol class="steps">
    <li><b data-i18n="how.1.h"></b><span data-i18n="how.1.p"></span></li>
    <li><b data-i18n="how.2.h"></b><span data-i18n="how.2.p"></span></li>
    <li><b data-i18n="how.3.h"></b><span data-i18n="how.3.p"></span></li>
    <li><b data-i18n="how.4.h"></b><span data-i18n="how.4.p"></span></li>
  </ol>
</section>
<section class="block rv" id="pay">
  <h2 class="h2"><span class="num">02</span><span data-i18n="pay.h"></span></h2>
  <ul class="pay" id="paylist"></ul>
  <p class="prose strong" data-i18n="pay.rule"></p>
</section>
<section class="block rv" id="request">
  <h2 class="h2"><span class="num">03</span><span data-i18n="req.h"></span></h2>
  <p class="prose" data-i18n="req.p"></p>
  <div class="builder">
    <div class="fields">
      <label for="rq-svc" data-i18n="req.svc"></label>
      <select id="rq-svc"></select>
      <label for="rq-name" data-i18n="req.name"></label>
      <input id="rq-name" type="text" maxlength="60" autocomplete="off">
      <label for="rq-what" data-i18n="req.what"></label>
      <textarea id="rq-what" rows="4" maxlength="700" data-i18n-placeholder="req.what.ph"></textarea>
      <label for="rq-budget" data-i18n="req.budget"></label>
      <input id="rq-budget" type="text" maxlength="60" autocomplete="off" data-i18n-placeholder="req.budget.ph">
      <label for="rq-when" data-i18n="req.when"></label>
      <input id="rq-when" type="text" maxlength="60" autocomplete="off" data-i18n-placeholder="req.when.ph">
    </div>
    <div class="out">
      <label for="rq-out" data-i18n="req.out"></label>
      <textarea id="rq-out" rows="11" readonly></textarea>
      <div class="cta">
        <button class="btn primary" type="button" id="rq-copy" data-i18n="req.copy"></button>
        <a class="btn" id="rq-kofi" href="https://ko-fi.com/rdweeb" target="_blank" rel="noopener" data-i18n="req.kofi"></a>
        <a class="btn ghost" href="contact.html" data-i18n="req.contact"></a>
      </div>
      <p class="small" id="rq-status" role="status"></p>
    </div>
  </div>
</section>
</main>

  <div class="foot-row">
    <p class="foot-note" data-i18n="foot.note">Made by hand in plain HTML, CSS and JavaScript.</p>

  </div>

    <a href="settings.html" data-i18n="nav.settings">Settings</a>
  </div>
</footer>
